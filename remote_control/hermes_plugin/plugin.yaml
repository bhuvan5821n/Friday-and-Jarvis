name: whatsapp-platform
label: WhatsApp
kind: platform
version: 1.0.0
description: >
  WhatsApp gateway adapter for Hermes Agent, hardened for Bhuvan's laptop.

  Identical to the bundled WhatsApp adapter except for one addition: a strict
  admission gate that runs before any message becomes an AI request. Only
  messages from the one authorized number, that begin with an assistant name
  (Jarvis / Friday / Nexus / Hermes, bare or slash-prefixed), are processed.
  Every other self-chat message stays an ordinary personal note: no model, no
  tools, no memory, no reply, and no log of its contents.

  This plugin subclasses the bundled adapter. The Hermes installation itself
  is unmodified.
author: Bhuvan
requires_env:
  - name: WHATSAPP_ENABLED
    description: "Enable the WhatsApp adapter (requires the Node.js bridge running)"
    prompt: "Enable WhatsApp? (true/false)"
    password: false
optional_env:
  - name: WHATSAPP_ALLOWED_USERS
    description: "Comma-separated WhatsApp user IDs allowed to talk to the bot"
    prompt: "Allowed users (comma-separated)"
    password: false
  - name: WHATSAPP_HOME_CHANNEL
    description: "Default chat ID for cron / notification delivery"
    prompt: "Home channel ID"
    password: false
  - name: WHATSAPP_HOME_CHANNEL_NAME
    description: "Display name for the WhatsApp home channel"
    prompt: "Home channel display name"
    password: false
